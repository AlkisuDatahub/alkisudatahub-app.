name: Signed Release Build

on:
  workflow_dispatch: {}

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/alkisudatahub-release.jks

      - name: Build signed release APK
        run: >
          gradle assembleRelease --no-daemon
          -PRELEASE_STORE_FILE=alkisudatahub-release.jks
          -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: alkisudatahub-release-apk
          path: app/build/outputs/apk/release/app-release.apk
