name: Generate Release Keystore

# Run this ONCE (Actions tab -> Generate Release Keystore -> Run workflow).
# Download the "release-keystore" artifact afterwards, then follow the
# README to add it to your repo secrets for signed release builds.

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore alkisudatahub-release.jks \
            -alias alkisudatahub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "ChangeThisPassword123!" \
            -keypass "ChangeThisPassword123!" \
            -dname "CN=AlkisuDatahub, OU=AlkisuDatahub, O=Geraldimer ICT, L=Sokoto, S=Sokoto, C=NG"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: alkisudatahub-release.jks
